[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --cov=src
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=90

filterwarnings =
    ignore::DeprecationWarning
